<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">FPGA digital-clock building blocks</title>
<desc id="desc">Component-level VHDL sources for an HH:MM:SS display study. Clock synchronization: CLK + fast / slow adjustment inputs, Selectable divided clock output; Time counter: Reset / initialization · six digit outputs, Seconds, minutes and hours; Seven-segment decoder: 4-bit digit input, 7-bit segment pattern output; Display selection: 3-bit select input, Six display-enable outputs + decimal point</desc>
<rect width="1100" height="460" rx="18" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="48" fill="#172b3a" font-size="29" font-weight="700">FPGA digital-clock building blocks</text>
<text x="34" y="77" fill="#526576" font-size="17">Component-level VHDL sources for an HH:MM:SS display study</text>
<rect x="34" y="104" width="505" height="119" rx="11" fill="white" stroke="#d8e2eb"/>
<path d="M35 114 V213" stroke="#287b8e" stroke-width="4"/>
<text x="54" y="136" fill="#183345" font-size="20" font-weight="700">Clock synchronization</text>
<text x="54" y="163" fill="#465e70" font-size="17">CLK + fast / slow adjustment inputs</text>
<text x="54" y="186" fill="#465e70" font-size="17">Selectable divided clock output</text>
<rect x="559" y="104" width="505" height="119" rx="11" fill="white" stroke="#d8e2eb"/>
<path d="M560 114 V213" stroke="#287b8e" stroke-width="4"/>
<text x="579" y="136" fill="#183345" font-size="20" font-weight="700">Time counter</text>
<text x="579" y="163" fill="#465e70" font-size="17">Reset / initialization · six digit outputs</text>
<text x="579" y="186" fill="#465e70" font-size="17">Seconds, minutes and hours</text>
<rect x="34" y="243" width="505" height="119" rx="11" fill="white" stroke="#d8e2eb"/>
<path d="M35 253 V352" stroke="#287b8e" stroke-width="4"/>
<text x="54" y="275" fill="#183345" font-size="20" font-weight="700">Seven-segment decoder</text>
<text x="54" y="302" fill="#465e70" font-size="17">4-bit digit input</text>
<text x="54" y="325" fill="#465e70" font-size="17">7-bit segment pattern output</text>
<rect x="559" y="243" width="505" height="119" rx="11" fill="white" stroke="#d8e2eb"/>
<path d="M560 253 V352" stroke="#287b8e" stroke-width="4"/>
<text x="579" y="275" fill="#183345" font-size="20" font-weight="700">Display selection</text>
<text x="579" y="302" fill="#465e70" font-size="17">3-bit select input</text>
<text x="579" y="325" fill="#465e70" font-size="17">Six display-enable outputs + decimal point</text>
<text x="34" y="420" fill="#526576" font-size="16">Source-module overview. The complete top-level wiring and display scan logic are not supplied.</text>
</g></svg>
